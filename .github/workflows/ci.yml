name: CI Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  validate:
    name: Lint, Test, and Build
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: "file:./dev.db"

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm install --legacy-peer-deps

      - name: Run Linters
        run: |
          npm run lint -w frontend

      - name: Generate Prisma Client
        run: npm run db:generate -w backend

      - name: Setup Database (SQLite)
        run: npm run db:push -w backend

      - name: Run Backend Tests
        run: npm run test:backend

      - name: Run Frontend Tests
        run: npm run test:frontend

      - name: Compile Backend (TypeScript)
        run: npm run build -w backend

      - name: Build Frontend (Next.js Production)
        run: npm run build -w frontend
        env:
          NEXT_PUBLIC_API_URL: http://localhost:3001

  docker-check:
    name: Verify Docker Container Builds
    runs-on: ubuntu-latest
    needs: validate

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Backend Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: backend/Dockerfile
          push: false
          tags: salary-assessment-backend:latest

      - name: Build Frontend Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: frontend/Dockerfile
          push: false
          build-args: |
            NEXT_PUBLIC_API_URL=http://localhost:3001
          tags: salary-assessment-frontend:latest
